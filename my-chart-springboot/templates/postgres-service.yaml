apiVersion: v1 # specifies the version of kube api to use for given resource
kind: Service #its a type of resource  here we are use service resource
metadata:
  name: {{ .Values.postgres.name }} #forward the request to pod with label of this value
  namespace: {{ .Values.postgres.namespace }}
spec:
  ports:
    - protocol: TCP
      port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.targetPort}}
  selector:
    app: {{ .Values.postgres.name }}