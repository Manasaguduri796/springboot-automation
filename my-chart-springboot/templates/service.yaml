apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.app.name }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }} #port number exposes internally in the cluster
      targetPort: {{ .Values.service.targetPort }} #port the container on listening
      nodePort: {{ .Values.service.nodePort }} #access service via external port number